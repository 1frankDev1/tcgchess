<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Personajes - Ajedrez 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body class="chess-body" style="overflow-y: auto;">
    <div class="admin-section glass-morphism" style="margin: 40px auto; max-width: 1200px; padding: 40px; border-radius: 30px; min-height: 80vh;">
        <header class="admin-header" style="margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #fff 0%, var(--primary-color) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Administración de Personajes</h1>
            <div class="controls-grid" style="justify-content: center; margin-top: 20px;">
                <a href="chess.html" class="ctrl-btn">
                    <i class="fas fa-chess-board"></i>
                    <span>Volver al Juego</span>
                </a>
                <button id="btn-sync-storage" class="ctrl-btn">
                    <i class="fas fa-sync"></i>
                    <span>Sincronizar Storage</span>
                </button>
                <button id="btn-save-all" class="ctrl-btn" style="background: var(--primary-color); color: #000;">
                    <i class="fas fa-save"></i>
                    <span>Guardar Todo</span>
                </button>
            </div>

            <div class="selection-tabs" style="margin-top: 30px;">
                <button class="tab-btn active" data-side="player">Jugador (Blancas)</button>
                <button class="tab-btn" data-side="opponent">Rival (Negras)</button>
            </div>
        </header>

        <main class="admin-content">
            <div id="characters-grid" class="spirits-grid">
                <!-- Se cargará dinámicamente como tarjetas -->
            </div>
        </main>
    </div>

    <script type="module" src="js/adminPersonajes.js"></script>
</body>
</html>
