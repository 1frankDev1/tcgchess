<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Personajes - Ajedrez 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Administración de Personajes</h1>
            <div class="controls">
                <a href="chess.html" class="btn btn-secondary">Volver al Juego</a>
                <button id="btn-sync-storage" class="btn">Sincronizar Storage</button>
            </div>
        </header>

        <main class="admin-content">
            <section class="characters-table-section">
                <table>
                    <thead>
                        <tr>
                            <th>Vista Previa</th>
                            <th>Archivo</th>
                            <th>Nombre</th>
                            <th>Clasificación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="storage-files-list">
                        <!-- Se cargará dinámicamente -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="js/adminPersonajes.js"></script>
</body>
</html>
