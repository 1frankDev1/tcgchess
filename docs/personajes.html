<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Personajes - Chess</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>
    <div id="app" class="selection-panel">
        <header>
            <h1>Elige tus Personajes</h1>
            <nav>
                <a href="chess.html" class="button">Volver al Juego</a>
                <a href="adminPersonajes.html" class="button">Admin Personajes</a>
                <button id="btn-logout-selection">Cerrar Sesión</button>
            </nav>
        </header>

        <main id="selection-content">
            <div id="user-login" class="overlay">
                <div class="auth-box">
                    <h2>Identifícate para guardar tus personajes</h2>
                    <input type="text" id="user-username" placeholder="Username">
                    <input type="password" id="user-password" placeholder="Password">
                    <button id="btn-login-user">Entrar</button>
                    <div id="user-login-error" class="error"></div>
                </div>
            </div>

            <div id="selection-dashboard" class="hidden">
                <div class="selection-tabs">
                    <button class="tab-btn active" data-tab="player">Tus Personajes (Blancas)</button>
                    <button class="tab-btn" data-tab="opponent">Personajes del Contrincante (Negras)</button>
                </div>

                <div class="bento-grid" id="bento-categories">
                    <div class="bento-item" data-type="Rey">
                        <i class="fas fa-chess-king"></i>
                        <span>Rey</span>
                    </div>
                    <div class="bento-item" data-type="Reina">
                        <i class="fas fa-chess-queen"></i>
                        <span>Reina</span>
                    </div>
                    <div class="bento-item" data-type="Torre">
                        <i class="fas fa-chess-rook"></i>
                        <span>Torre</span>
                    </div>
                    <div class="bento-item" data-type="Alfil">
                        <i class="fas fa-chess-bishop"></i>
                        <span>Alfil</span>
                    </div>
                    <div class="bento-item" data-type="Caballo">
                        <i class="fas fa-chess-knight"></i>
                        <span>Caballo</span>
                    </div>
                    <div class="bento-item" data-type="Peón">
                        <i class="fas fa-chess-pawn"></i>
                        <span>Peón</span>
                    </div>
                </div>

                <div id="character-selection-area" class="hidden">
                    <div class="selection-header">
                        <button id="btn-back-to-bento" class="btn-secondary"><i class="fas fa-arrow-left"></i> Volver</button>
                        <h2 id="current-category-title">Categoría</h2>
                    </div>
                    <div id="characters-list" class="characters-grid">
                        <!-- Personajes con model-viewer se cargarán aquí -->
                    </div>
                </div>

                <div class="global-actions">
                    <button id="btn-save-selections" class="btn-primary">Guardar Todas las Selecciones</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/personajes.js"></script>
</body>
</html>
